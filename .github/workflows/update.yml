name: Update revisions and PRs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_revisions:
        description: 'Max revisions to process'
        default: '10'
        type: string
      max_prs:
        description: 'Max PRs to process'
        default: '10'
        type: string

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: gh-pages
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: ~/.npm
          key: npm-spec-${{ runner.os }}
          restore-keys: npm-spec-

      - name: Install Python dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: venv/bin/python build.py bootstrap

      - name: Set git identity
        if: steps.check.outputs.update == 'Yes'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install lxml dependencies
        if: steps.check.outputs.update == 'Yes'
        run: sudo apt-get install -y libxml2-dev libxslt1-dev

      - name: Clone spec repo
        if: steps.check.outputs.update == 'Yes'
        run: make clone

      - name: Update revisions
        if: steps.check.outputs.update_revs == 'Yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: venv/bin/python build.py rev -c ${{ inputs.max_revisions || '10' }} all

      - name: Update PRs
        if: steps.check.outputs.update_prs == 'Yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: venv/bin/python build.py pr -c ${{ inputs.max_prs || '10' }} all

      - name: Commit and push
        if: steps.check.outputs.update == 'Yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add history broken_revs.json
          if ! git diff --cached --quiet; then
            git commit -m "update history"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin gh-pages
          fi
